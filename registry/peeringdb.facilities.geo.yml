# Datacenter facilities with real coordinates. This is the map layer: it turns
# an exchange's city name into a point on the earth without a hand-maintained
# lookup table that would rot.
source_id: peeringdb.facilities.geo
status: active  # re-enabled 2026-09-07 with an API key; see the auth note below
cadence: weekly
schema_id: pdb-facilities.v1

publisher: PeeringDB
publisher_tier: primary
destroys_own_history: true
licence: "PeeringDB API; see https://www.peeringdb.com/ terms — VERIFY before redistributing derived data commercially"
personal_data: none
storage: git

# PeeringDB is a volunteer-run non-profit, not a vendor API. 15s between
# requests, weekly cadence, and one shard: this repo should be invisible in
# their logs. A 429 here means back off, not retry harder.
# WHY THIS NEEDS A KEY: /api/fac unfiltered returns all ~5,860 facilities and
# 429s for anonymous callers even when /api/ix and /api/netixlan succeed in the
# same run — a per-query limit, not general throttling. PeeringDB issues free
# API keys and prefers authenticated access for heavier reads.
#
# scheme MATTERS: PeeringDB answers `Authorization: Bearer <key>` with 400 and
# `Api-Key <key>` with 401 on a bad key — so Bearer is not merely rejected, it
# is not understood, and the 400 would read as a malformed request rather than
# as the wrong scheme. An earlier version of this comment said bearer_env; that
# advice was wrong and would have failed in a way that looks unrelated to auth.
notes: >-
  5,860 facilities, ~5,256 with coordinates, across ~2,066 cities. Requested
  with an explicit fields= list: the full record carries operator contact
  details, and this repo fetches none of them. Also the reason a map needs no
  basemap package — plotted at (longitude, latitude) the facilities trace the
  populated world themselves.

# No credential. Verified 2026-09-08: the same URL returns HTTP 200 and 5,860
# rows unauthenticated. The key was carried to raise the rate limit and did not
# -- every failure this source has recorded is retries_exhausted_status_429,
# with the key set. The two sibling peeringdb sources have never had a key and
# fail at the same rate, so the limit is per-host, not per-credential.
#
# A credential that buys nothing is pure liability: one more secret to rotate,
# one more way for CI to break, and no capability in return.

endpoints:
  - url: "https://www.peeringdb.com/api/fac?fields=id,name,city,country,latitude,longitude,net_count,ix_count"
    delay_seconds: 15

# The gate guards the field names, not the "@" character: facility names
# legitimately contain it ("Silver @ Exchange", "Colo@34"). What must never
# appear is an email FIELD, which would mean the API ignored fields=.
gates:
  expect_status: 200
  min_bytes: 300000
  content_type_any: [json]
  must_contain: ["latitude"]
  must_not_contain: ["Access Denied", "tech_email", "policy_email", "sales_email"]
  # 50%: derived from observed volatility, not taste. Across the fleet's
  # manifest history no source has ever shrunk more than 2.3% between
  # captures, so 50 is ~20x the worst real movement while still catching
  # truncation. Set high on purpose: the baseline is the LAST SUCCESSFUL
  # capture, so a gate that fires on a legitimate change keeps firing
  # forever against a size the publisher has moved on from, and every
  # capture in between is lost. Capture must not fail; health flags an
  # odd source AFTER the bytes are safely stored.
  max_shrink_pct: 50