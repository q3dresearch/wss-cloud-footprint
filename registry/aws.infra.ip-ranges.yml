# AWS's published IP ranges. Only the current file is served; growth in
# prefixes per region is a proxy for infrastructure build-out.
source_id: aws.infra.ip-ranges
status: active
cadence: weekly
schema_id: aws-ipranges.v1

publisher: Amazon Web Services
publisher_tier: first_party
destroys_own_history: true
licence: "public AWS endpoint; see https://aws.amazon.com/service-terms/"
personal_data: none
storage: git

notes: >-
  Prefix counts per region and per service track where AWS is adding network
  capacity. AWS serves only the current file, with a syncToken but no archive.

endpoints:
  - url: "https://ip-ranges.amazonaws.com/ip-ranges.json"
    delay_seconds: 2

gates:
  expect_status: 200
  min_bytes: 1000000
  content_type_any: [json]
  must_contain: ["ip_prefix"]
  must_not_contain: ["Access Denied"]
  # 50%: derived from observed volatility, not taste. Across the fleet's
  # manifest history no source has ever shrunk more than 2.3% between
  # captures, so 50 is ~20x the worst real movement while still catching
  # truncation. Set high on purpose: the baseline is the LAST SUCCESSFUL
  # capture, so a gate that fires on a legitimate change keeps firing
  # forever against a size the publisher has moved on from, and every
  # capture in between is lost. Capture must not fail; health flags an
  # odd source AFTER the bytes are safely stored.
  max_shrink_pct: 50