<text x="114.0" y="252.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">meta — 77.1 Tbps</text>
<circle cx="100.0" cy="267.0" r="5" fill="#2a78d6"/>
<text x="114.0" y="271.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">aws — 52.4 Tbps</text>
<circle cx="100.0" cy="286.0" r="5" fill="#eb6834"/>
