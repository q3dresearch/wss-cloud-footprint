<text x="28.0" y="60.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Each question placed where the capture makes it answerable. Cadence is weekly; first capture 2026-09-01; 6 distinct capture days so far.</text>
